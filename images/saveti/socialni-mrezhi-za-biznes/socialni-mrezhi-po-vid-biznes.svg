  <circle cx="316" cy="366" r="8" fill="#2a8178"/>
  <circle cx="644" cy="366" r="8" fill="#2a8178"/>
  <circle cx="730" cy="366" r="8" fill="#1f6a66"/>
  <rect x="24" y="386" width="752" height="40" rx="8" fill="#d5f6eb" fill-opacity="0.5"/>
  <text x="40" y="411" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Автосервизи и майстори</text>
  <circle cx="316" cy="406" r="8" fill="#2a8178"/>
  <circle cx="730" cy="406" r="8" fill="#1f6a66"/>
  <text x="40" y="451" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Недвижими имоти</text>
  <circle cx="316" cy="446" r="8" fill="#2a8178"/>
  <circle cx="404" cy="446" r="8" fill="#2a8178"/>
  <circle cx="644" cy="446" r="8" fill="#2a8178"/>
  <rect x="24" y="466" width="752" height="40" rx="8" fill="#d5f6eb" fill-opacity="0.5"/>
  <text x="40" y="491" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">B2B фирми</text>
