  <line x1="688" y1="96" x2="688" y2="506" stroke="#c9eee4" stroke-width="1.5"/>
  <rect x="24" y="146" width="752" height="40" rx="8" fill="#d5f6eb" fill-opacity="0.5"/>
  <text x="40" y="171" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Ресторанти и кафенета</text>
