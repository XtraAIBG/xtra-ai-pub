  <text x="248" y="542" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#172933">Подходяща, ако снимате видео</text>
  <text x="40" y="576" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Проверете спрямо това, откъде реално идват запитванията Ви днес.</text>
