<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" width="800" height="612" role="img" aria-labelledby="t d">
  <title id="t">Таблица кои социални мрежи и профилът в Google са подходящи за девет вида малък бизнес, от ресторанти до B2B фирми</title>
  <desc id="d">Матрица с видовете бизнес по редове и Facebook, Instagram, TikTok, LinkedIn, YouTube и профила в Google по колони; запълнен кръг означава подходяща мрежа, празен кръг означава подходяща, ако снимате видео.</desc>
  <rect x="1" y="1" width="798" height="610" rx="16" fill="#ffffff" stroke="#c9eee4" stroke-width="1.5"/>
  <text x="40" y="50" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#172933">Коя мрежа за какъв бизнес</text>
  <text x="40" y="78" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Практически ориентир по вид дейност, не се основава на статистика</text>
  <text x="40" y="128" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f5d63">Вид бизнес</text>
  <text x="316" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">Facebook</text>
  <text x="404" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">Instagram</text>
  <text x="488" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">TikTok</text>
  <text x="566" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">LinkedIn</text>
  <text x="644" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">YouTube</text>
  <text x="730" y="110" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">Профил</text>
  <text x="730" y="128" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#172933">в Google</text>
