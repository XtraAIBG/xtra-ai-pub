<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" width="800" height="488" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Пет места за основната ключова дума: заглавието на страницата (title), основното заглавие (H1), първият абзац, едно от подзаглавията и краткото описание (meta description)</title>
  <desc id="d">Опростена схема на резултат в търсенето и на страница с номерирани места, на които да поставите основната дума.</desc>
