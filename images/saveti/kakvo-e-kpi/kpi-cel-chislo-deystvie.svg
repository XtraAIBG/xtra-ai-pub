<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Трите части на полезния показател: цел, число и действие, с измислен пример за салон за красота</title>
  <desc id="d">Три карти, свързани със стрелки: целта казва какво искате да постигнете, числото показва докъде сте стигнали, а действието е това, което ще промените, ако числото не се движи в желаната посока; отдолу същите три части са показани в измислен пример за салон, който иска повече клиенти да се връщат.</desc>
  <rect x="1" y="1" width="798" height="518" rx="16" fill="#ffffff" stroke="#dbe5e7" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#172933">Трите части на полезния показател</text>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#4f5d63">Цел, число и действие</text>
  <rect x="24" y="104" width="224" height="172" rx="14" fill="#d5f6eb"/>
  <circle cx="62" cy="142" r="18" fill="#2a8178"/>
  <text x="62" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="92" y="148" font-size="18" font-weight="700" fill="#172933">Цел</text>
  <text x="46" y="192" font-size="15" fill="#4f5d63">Какво искате</text>
  <text x="46" y="214" font-size="15" fill="#4f5d63">да постигнете</text>
  <rect x="288" y="104" width="224" height="172" rx="14" fill="#d5f6eb"/>
  <circle cx="326" cy="142" r="18" fill="#2a8178"/>
  <text x="326" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="356" y="148" font-size="18" font-weight="700" fill="#172933">Число</text>
  <text x="310" y="192" font-size="15" fill="#4f5d63">Докъде сте</text>
  <text x="310" y="214" font-size="15" fill="#4f5d63">стигнали</text>
  <rect x="552" y="104" width="224" height="172" rx="14" fill="#d5f6eb"/>
  <circle cx="590" cy="142" r="18" fill="#2a8178"/>
  <text x="590" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="620" y="148" font-size="18" font-weight="700" fill="#172933">Действие</text>
  <text x="574" y="192" font-size="15" fill="#4f5d63">Какво ще промените,</text>
  <text x="574" y="214" font-size="15" fill="#4f5d63">ако числото не се</text>
  <text x="574" y="236" font-size="15" fill="#4f5d63">движи в желаната</text>
  <text x="574" y="258" font-size="15" fill="#4f5d63">посока</text>
  <line x1="254" y1="190" x2="276" y2="190" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M270 183 L278 190 L270 197" fill="none" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="518" y1="190" x2="540" y2="190" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M534 183 L542 190 L534 197" fill="none" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="300" width="752" height="196" rx="14" fill="#d0ebfc"/>
  <text x="44" y="332" font-size="16" font-weight="700" fill="#172933">Измислен пример: салон за красота</text>
  <text x="44" y="366" font-size="15" font-weight="700" fill="#256f9e">Цел:</text>
  <text x="44" y="390" font-size="14" fill="#172933">повече клиенти</text>
  <text x="44" y="410" font-size="14" fill="#172933">да се връщат</text>
  <text x="300" y="366" font-size="15" font-weight="700" fill="#256f9e">Число:</text>
  <text x="300" y="390" font-size="14" fill="#172933">делът на клиентите,</text>
  <text x="300" y="410" font-size="14" fill="#172933">които си запазват</text>
  <text x="300" y="430" font-size="14" fill="#172933">нов час в рамките на</text>
  <text x="300" y="450" font-size="14" fill="#172933">месеца след</text>
  <text x="300" y="470" font-size="14" fill="#172933">посещението</text>
  <text x="556" y="366" font-size="15" font-weight="700" fill="#256f9e">Действие:</text>
  <text x="556" y="390" font-size="14" fill="#172933">напомняне след</text>
  <text x="556" y="410" font-size="14" fill="#172933">посещението и</text>
  <text x="556" y="430" font-size="14" fill="#172933">проверка дали</text>
  <text x="556" y="450" font-size="14" fill="#172933">числото се променя</text>
  <path d="M262 386 L272 394 L262 402" fill="none" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M518 386 L528 394 L518 402" fill="none" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
