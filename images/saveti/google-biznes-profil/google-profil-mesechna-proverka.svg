<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Месечна проверка на Google бизнес профила: работно време, меню, цени и услуги, снимки, оценки и коментари без отговор</title>
  <desc id="d">Четири карти с това, което да проверявате в профила веднъж месечно.</desc>
