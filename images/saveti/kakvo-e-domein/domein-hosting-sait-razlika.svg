<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" width="800" height="484" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Сравнение на домейн, хостинг и сайт: домейнът е адресът, хостингът е мястото, където се съхраняват файловете, а сайтът е съдържанието, което посетителят вижда</title>
  <desc id="d">Три карти показват ролята на домейна, хостинга и сайта, а долната лента обяснява, че когато домейнът е Ваш, можете да смените хостинга или сайта, без да сменяте адреса.</desc>

  <!-- background card -->
  <rect x="1" y="1" width="798" height="482" rx="16" fill="#ffffff" stroke="#d9e6e3" stroke-width="1.5"/>

  <!-- title -->
  <text x="40" y="56" font-size="22" font-weight="700" fill="#172933">Домейн, хостинг и сайт: каква е разликата</text>
  <text x="40" y="84" font-size="15" fill="#4f5d63">Адрес, място и съдържание на Вашето присъствие в интернет</text>

  <!-- ===== card 1: domain ===== -->
  <rect x="40" y="112" width="224" height="264" rx="14" fill="#ffffff" stroke="#2a8178" stroke-width="1.5"/>
  <circle cx="152" cy="162" r="30" fill="#c9eee4"/>
  <!-- globe icon -->
  <circle cx="152" cy="162" r="15" fill="none" stroke="#2a8178" stroke-width="2"/>
  <ellipse cx="152" cy="162" rx="6.5" ry="15" fill="none" stroke="#2a8178" stroke-width="2"/>
  <line x1="137" y1="162" x2="167" y2="162" stroke="#2a8178" stroke-width="2"/>
  <text x="152" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#172933">Домейн</text>
  <rect x="112" y="234" width="80" height="26" rx="13" fill="#d5f6eb"/>
  <text x="152" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1f6a66">Адрес</text>
  <text x="152" y="290" text-anchor="middle" font-size="14" fill="#4f5d63">Име и окончание</text>
  <text x="152" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">като .bg или .com,</text>
  <text x="152" y="330" text-anchor="middle" font-size="14" fill="#4f5d63">по които клиентите</text>
  <text x="152" y="350" text-anchor="middle" font-size="14" fill="#4f5d63">намират сайта</text>

  <!-- ===== card 2: hosting ===== -->
  <rect x="288" y="112" width="224" height="264" rx="14" fill="#ffffff" stroke="#256f9e" stroke-width="1.5"/>
  <circle cx="400" cy="162" r="30" fill="#d0ebfc"/>
  <!-- server icon -->
  <rect x="384" y="148" width="32" height="12" rx="3" fill="none" stroke="#256f9e" stroke-width="2"/>
  <rect x="384" y="164" width="32" height="12" rx="3" fill="none" stroke="#256f9e" stroke-width="2"/>
  <circle cx="391" cy="154" r="1.8" fill="#256f9e"/>
  <circle cx="391" cy="170" r="1.8" fill="#256f9e"/>
  <line x1="398" y1="154" x2="410" y2="154" stroke="#256f9e" stroke-width="2" stroke-linecap="round"/>
  <line x1="398" y1="170" x2="410" y2="170" stroke="#256f9e" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#172933">Хостинг</text>
  <rect x="360" y="234" width="80" height="26" rx="13" fill="#d0ebfc"/>
  <text x="400" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#256f9e">Място</text>
  <text x="400" y="290" text-anchor="middle" font-size="14" fill="#4f5d63">Файловете на сайта,</text>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">съхранени на сървър,</text>
  <text x="400" y="330" text-anchor="middle" font-size="14" fill="#4f5d63">достъпен в интернет</text>
  <text x="400" y="350" text-anchor="middle" font-size="14" fill="#4f5d63">по всяко време</text>

  <!-- ===== card 3: site ===== -->
  <rect x="536" y="112" width="224" height="264" rx="14" fill="#ffffff" stroke="#1f6a66" stroke-width="1.5"/>
  <circle cx="648" cy="162" r="30" fill="#d5f6eb"/>
  <!-- browser window icon -->
  <rect x="632" y="150" width="32" height="25" rx="3" fill="none" stroke="#1f6a66" stroke-width="2"/>
  <line x1="632" y1="157" x2="664" y2="157" stroke="#1f6a66" stroke-width="2"/>
  <line x1="637" y1="163" x2="657" y2="163" stroke="#1f6a66" stroke-width="2" stroke-linecap="round"/>
  <line x1="637" y1="169" x2="651" y2="169" stroke="#1f6a66" stroke-width="2" stroke-linecap="round"/>
  <text x="648" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#172933">Сайт</text>
  <rect x="590" y="234" width="116" height="26" rx="13" fill="#d5f6eb"/>
  <text x="648" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1f6a66">Съдържание</text>
  <text x="648" y="290" text-anchor="middle" font-size="14" fill="#4f5d63">Страниците, текстовете,</text>
  <text x="648" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">снимките и формите,</text>
  <text x="648" y="330" text-anchor="middle" font-size="14" fill="#4f5d63">които посетителят</text>
  <text x="648" y="350" text-anchor="middle" font-size="14" fill="#4f5d63">вижда и използва</text>

  <!-- ===== bottom band ===== -->
  <rect x="40" y="396" width="720" height="64" rx="14" fill="#d5f6eb"/>
  <text x="400" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6a66">Когато домейнът е Ваш, можете да смените хостинга</text>
  <text x="400" y="444" text-anchor="middle" font-size="15" fill="#172933">или да изградите нов сайт, без клиентите да трябва да научават нов адрес</text>
</svg>
