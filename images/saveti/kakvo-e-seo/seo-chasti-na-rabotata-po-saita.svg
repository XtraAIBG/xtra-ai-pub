<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" width="800" height="584" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Четирите части на работата по сайта: техническа част, съдържание на страниците (on-page), връзки от други сайтове и локално присъствие</title>
  <desc id="d">Четири реда, всеки с икона, име на частта и кратко обяснение какво включва; отдолу е отбелязано, че частите се допълват и слабост в една може да ограничи резултата от останалите.</desc>

  <!-- background card -->
  <rect x="1" y="1" width="798" height="582" rx="16" fill="#ffffff" stroke="#dbe5e7" stroke-width="1.5"/>

  <!-- heading -->
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#172933">От какви части се състои работата по сайта</text>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#4f5d63">Всяка част решава различен проблем</text>

  <!-- row 1: technical -->
  <rect x="24" y="104" width="751" height="88" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="148" r="22" fill="#c9eee4" stroke="#2a8178" stroke-width="1.5"/>
  <circle cx="64" cy="148" r="8" fill="none" stroke="#1f6a66" stroke-width="2"/>
  <line x1="64" y1="134" x2="64" y2="138" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="64" y1="158" x2="64" y2="162" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="50" y1="148" x2="54" y2="148" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="74" y1="148" x2="78" y2="148" stroke="#1f6a66" stroke-width="2.4" stroke-linecap="round"/>
  <text x="100" y="153" font-size="16" font-weight="700" fill="#172933">Техническа част</text>
  <text x="330" y="131" font-size="15" fill="#4f5d63">Сайтът се зарежда бързо, работи добре</text>
  <text x="330" y="153" font-size="15" fill="#4f5d63">на телефон, няма счупени страници и</text>
  <text x="330" y="175" font-size="15" fill="#4f5d63">търсачката може да обходи всичко важно</text>

  <!-- row 2: on-page -->
  <rect x="24" y="204" width="751" height="88" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="248" r="22" fill="#c9eee4" stroke="#2a8178" stroke-width="1.5"/>
  <rect x="55" y="236" width="18" height="24" rx="3" fill="none" stroke="#1f6a66" stroke-width="2"/>
  <line x1="59" y1="243" x2="69" y2="243" stroke="#1f6a66" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="248" x2="69" y2="248" stroke="#1f6a66" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="253" x2="66" y2="253" stroke="#1f6a66" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="243" font-size="16" font-weight="700" fill="#172933">Съдържание на</text>
  <text x="100" y="265" font-size="16" font-weight="700" fill="#172933">страниците (on-page)</text>
  <text x="330" y="231" font-size="15" fill="#4f5d63">Всяка страница отговаря на един ясен</text>
  <text x="330" y="253" font-size="15" fill="#4f5d63">въпрос с думите, които клиентите</text>
  <text x="330" y="275" font-size="15" fill="#4f5d63">използват при търсене</text>

  <!-- row 3: links -->
  <rect x="24" y="304" width="751" height="88" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="348" r="22" fill="#c9eee4" stroke="#2a8178" stroke-width="1.5"/>
  <rect x="49" y="342" width="15" height="10" rx="5" fill="none" stroke="#1f6a66" stroke-width="2" transform="rotate(-35 56.5 347)"/>
  <rect x="64" y="344" width="15" height="10" rx="5" fill="none" stroke="#1f6a66" stroke-width="2" transform="rotate(-35 71.5 349)"/>
  <text x="100" y="343" font-size="16" font-weight="700" fill="#172933">Връзки от</text>
  <text x="100" y="365" font-size="16" font-weight="700" fill="#172933">други сайтове</text>
  <text x="330" y="331" font-size="15" fill="#4f5d63">Други сайтове споменават Вашия и</text>
  <text x="330" y="353" font-size="15" fill="#4f5d63">препращат към него: знак за търсачката,</text>
  <text x="330" y="375" font-size="15" fill="#4f5d63">че сайтът е полезен и познат</text>

  <!-- row 4: local -->
  <rect x="24" y="404" width="751" height="88" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="448" r="22" fill="#c9eee4" stroke="#2a8178" stroke-width="1.5"/>
  <path d="M64 461 C58 453 55 448 55 444 A9 9 0 0 1 73 444 C73 448 70 453 64 461 Z" fill="none" stroke="#1f6a66" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="64" cy="444" r="3" fill="#1f6a66"/>
  <text x="100" y="453" font-size="16" font-weight="700" fill="#172933">Локално присъствие</text>
  <text x="330" y="431" font-size="15" fill="#4f5d63">За бизнес с адрес: как се показва</text>
  <text x="330" y="453" font-size="15" fill="#4f5d63">в картите и в местните резултати</text>
  <text x="330" y="475" font-size="15" fill="#4f5d63">при търсене в неговия град</text>

  <!-- note -->
  <rect x="24" y="504" width="751" height="56" rx="12" fill="#d0ebfc"/>
  <text x="400" y="527" text-anchor="middle" font-size="15" font-weight="600" fill="#172933">Частите се допълват.</text>
  <text x="400" y="547" text-anchor="middle" font-size="15" fill="#4f5d63">Слабост в една част може да ограничи резултата от останалите.</text>
</svg>
