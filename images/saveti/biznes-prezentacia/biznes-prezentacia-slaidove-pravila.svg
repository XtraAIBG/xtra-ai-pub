<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 608" width="800" height="608" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Правила за слайдовете: какво да правите и какво да избягвате в бизнес презентацията</title>
  <desc id="d">Две колони: вляво шест правила с отметка, като една идея на слайд и четим шрифт; вдясно четири неща за избягване с кръстче, като дълги абзаци и снимки без връзка с темата.</desc>
  <rect x="1" y="1" width="798" height="606" rx="16" fill="#ffffff" stroke="#dbe5e7" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#172933">Правила за слайдовете</text>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#4f5d63">Всеки слайд носи една идея</text>
  <rect x="24" y="112" width="368" height="392" rx="14" fill="#d5f6eb"/>
  <text x="48" y="148" font-size="18" font-weight="700" fill="#1f6a66">Правете</text>
  <circle cx="60" cy="195.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 195.0 L59 200.0 L67 190.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="200.0" font-size="15" fill="#172933">Една идея на слайд</text>
  <circle cx="60" cy="249.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 249.0 L59 254.0 L67 244.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="244.0" font-size="15" fill="#172933">Кратко заглавие,</text>
  <text x="84" y="264.0" font-size="15" fill="#172933">което казва извода</text>
  <circle cx="60" cy="303.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 303.0 L59 308.0 L67 298.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="308.0" font-size="15" fill="#172933">Четим, достатъчно едър шрифт</text>
  <circle cx="60" cy="357.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 357.0 L59 362.0 L67 352.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="352.0" font-size="15" fill="#172933">Еднакви цветове, шрифтове</text>
  <text x="84" y="372.0" font-size="15" fill="#172933">и лого на всички слайдове</text>
  <circle cx="60" cy="411.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 411.0 L59 416.0 L67 406.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="406.0" font-size="15" fill="#172933">Изображения, които помагат</text>
  <text x="84" y="426.0" font-size="15" fill="#172933">да се разбере казаното</text>
  <circle cx="60" cy="465.0" r="13" fill="#ffffff" stroke="#1f6a66" stroke-width="1.6"/>
  <path d="M54 465.0 L59 470.0 L67 460.0" fill="none" stroke="#1f6a66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="460.0" font-size="15" fill="#172933">Графика, когато</text>
  <text x="84" y="480.0" font-size="15" fill="#172933">сравнението е важно</text>
  <rect x="408" y="112" width="368" height="392" rx="14" fill="#d0ebfc"/>
  <text x="432" y="148" font-size="18" font-weight="700" fill="#256f9e">Избягвайте</text>
  <circle cx="444" cy="195.0" r="13" fill="#ffffff" stroke="#256f9e" stroke-width="1.6"/>
  <path d="M439 190.0 L449 200.0 M449 190.0 L439 200.0" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round"/>
  <text x="468" y="200.0" font-size="15" fill="#172933">Две мисли на един слайд</text>
  <circle cx="444" cy="249.0" r="13" fill="#ffffff" stroke="#256f9e" stroke-width="1.6"/>
  <path d="M439 244.0 L449 254.0 M449 244.0 L439 254.0" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round"/>
  <text x="468" y="254.0" font-size="15" fill="#172933">Дълги абзаци на слайда</text>
  <circle cx="444" cy="303.0" r="13" fill="#ffffff" stroke="#256f9e" stroke-width="1.6"/>
  <path d="M439 298.0 L449 308.0 M449 298.0 L439 308.0" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round"/>
  <text x="468" y="298.0" font-size="15" fill="#172933">Различни шрифтове и цветове</text>
  <text x="468" y="318.0" font-size="15" fill="#172933">на всеки слайд</text>
  <circle cx="444" cy="357.0" r="13" fill="#ffffff" stroke="#256f9e" stroke-width="1.6"/>
  <path d="M439 352.0 L449 362.0 M449 352.0 L439 362.0" stroke="#256f9e" stroke-width="2.2" stroke-linecap="round"/>
  <text x="468" y="362.0" font-size="15" fill="#172933">Снимки без връзка с темата</text>
  <rect x="24" y="528" width="752" height="56" rx="12" fill="#c9eee4"/>
  <text x="400" y="562" text-anchor="middle" font-size="15" fill="#172933">Ако на един слайд има две мисли, разделете ги на два отделни слайда.</text>
</svg>
