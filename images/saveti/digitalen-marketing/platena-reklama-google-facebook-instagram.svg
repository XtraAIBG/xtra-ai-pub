<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 508" width="780" height="508" role="img" aria-labelledby="t d">
  <title id="t">Сравнение на платената реклама в Google и във Facebook и Instagram: на кого се показва и за какви бизнеси подхожда</title>
  <desc id="d">Две карти една до друга: рекламата в Google достига до хора, които търсят конкретна услуга, с дневен бюджет за всяка кампания, а рекламата във Facebook и Instagram достига до хората, докато разглеждат публикации.</desc>

  <rect x="1" y="1" width="778" height="506" rx="16" fill="#ffffff" stroke="#c9eee4" stroke-width="1.5"/>

  <text x="40" y="50" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#172933">Платена реклама: Google или Facebook и Instagram</text>

  <!-- shared condition -->
  <rect x="24" y="72" width="732" height="60" rx="12" fill="#d0ebfc"/>
  <text x="44" y="97" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#172933">Най-полезна е, когато има къде да доведе хората:</text>
  <text x="44" y="119" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">подреден сайт или профил с ясен начин за контакт</text>

  <!-- left card: Google -->
  <rect x="24" y="152" width="356" height="332" rx="14" fill="#ffffff" stroke="#2a8178" stroke-width="1.5"/>
  <circle cx="60" cy="190" r="18" fill="#c9eee4"/>
  <circle cx="57" cy="187" r="7" fill="none" stroke="#1f6a66" stroke-width="2.5"/>
  <line x1="62" y1="192" x2="68" y2="198" stroke="#1f6a66" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="196" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f6a66">В Google</text>
  <line x1="44" y1="222" x2="360" y2="222" stroke="#c9eee4" stroke-width="1.5"/>

  <circle cx="50" cy="248" r="4" fill="#2a8178"/>
  <text x="64" y="253" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Показва се на хора, които</text>
  <text x="64" y="275" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">в момента търсят конкретна услуга</text>

  <circle cx="50" cy="308" r="4" fill="#2a8178"/>
  <text x="64" y="313" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Според Google избирате дневен</text>
  <text x="64" y="335" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">бюджет за всяка кампания и можете</text>
  <text x="64" y="357" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">да го променяте по всяко време</text>

  <circle cx="50" cy="390" r="4" fill="#2a8178"/>
  <text x="64" y="395" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Можете да започнете предпазливо</text>
  <text x="64" y="417" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">и да увеличите бюджета, когато</text>
  <text x="64" y="439" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">видите кои търсения носят</text>
  <text x="64" y="461" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">запитвания</text>

  <!-- right card: Facebook and Instagram -->
  <rect x="400" y="152" width="356" height="332" rx="14" fill="#ffffff" stroke="#256f9e" stroke-width="1.5"/>
  <circle cx="436" cy="190" r="18" fill="#d0ebfc"/>
  <rect x="427" y="180" width="18" height="20" rx="3" fill="none" stroke="#256f9e" stroke-width="2"/>
  <line x1="431" y1="186" x2="441" y2="186" stroke="#256f9e" stroke-width="2" stroke-linecap="round"/>
  <line x1="431" y1="191" x2="441" y2="191" stroke="#256f9e" stroke-width="2" stroke-linecap="round"/>
  <line x1="431" y1="196" x2="437" y2="196" stroke="#256f9e" stroke-width="2" stroke-linecap="round"/>
  <text x="464" y="196" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#256f9e">Във Facebook и Instagram</text>
  <line x1="420" y1="222" x2="736" y2="222" stroke="#d0ebfc" stroke-width="1.5"/>

  <circle cx="426" cy="248" r="4" fill="#256f9e"/>
  <text x="440" y="253" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Достига до хората, докато</text>
  <text x="440" y="275" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">разглеждат публикации, дори когато</text>
  <text x="440" y="297" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">не търсят нищо конкретно</text>

  <circle cx="426" cy="330" r="4" fill="#256f9e"/>
  <text x="440" y="335" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Често подхожда на бизнеси, чиято</text>
  <text x="440" y="357" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">работа изглежда добре на снимка</text>

  <circle cx="426" cy="390" r="4" fill="#256f9e"/>
  <text x="440" y="395" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">Например ресторанти, салони</text>
  <text x="440" y="417" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#172933">и магазини</text>
</svg>
