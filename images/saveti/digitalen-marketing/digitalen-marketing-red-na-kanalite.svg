<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" role="img" aria-labelledby="t d">
  <title id="t">Седем стъпки в дигиталния маркетинг за малкия бизнес по ред: сайт, профил в Google, видимост в търсачката, платена реклама, публикации, статии и текстове, имейли</title>
  <desc id="d">Вертикална последователност от седем номерирани стъпки, като публикациите, статиите и имейлите са отбелязани като стъпки, които могат да вървят успоредно с останалите.</desc>

  <rect x="1" y="1" width="798" height="658" rx="16" fill="#ffffff" stroke="#c9eee4" stroke-width="1.5"/>

  <text x="40" y="50" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#172933">В какъв ред да започнете с онлайн каналите</text>
  <text x="40" y="78" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#4f5d63">Обща насока: конкретният ред зависи от бизнеса Ви</text>

  <!-- band for steps 5-7 -->
  <rect x="24" y="362" width="572" height="192" rx="14" fill="#d5f6eb"/>
  <path d="M606 372 H614 V544 H606" fill="none" stroke="#1f6a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="628" y="438" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f6a66">Могат да вървят</text>
  <text x="628" y="458" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f6a66">успоредно с</text>
  <text x="628" y="478" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f6a66">останалите стъпки</text>

  <!-- connector -->
  <line x1="60" y1="134" x2="60" y2="518" stroke="#c9eee4" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="60" cy="134" r="18" fill="#2a8178"/>
  <text x="60" y="140" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="130" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Сайт</text>
  <text x="96" y="152" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Малък и ясен сайт с услугите, контактите и лесен начин за запитване</text>

  <!-- step 2 -->
  <circle cx="60" cy="198" r="18" fill="#2a8178"/>
  <text x="60" y="204" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="96" y="194" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Профил в Google</text>
  <text x="96" y="216" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Адрес, работно време, контакти и снимки</text>

  <!-- step 3 -->
  <circle cx="60" cy="262" r="18" fill="#2a8178"/>
  <text x="60" y="268" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="96" y="258" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Видимост в търсачката</text>
  <text x="96" y="280" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Сайт, който Google разбира и който отговаря на въпросите на клиентите</text>

  <!-- step 4 -->
  <circle cx="60" cy="326" r="18" fill="#2a8178"/>
  <text x="60" y="332" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="96" y="322" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Платена реклама</text>
  <text x="96" y="344" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">След като сайтът и профилът са подредени</text>

  <!-- step 5 -->
  <circle cx="60" cy="390" r="18" fill="#2a8178"/>
  <text x="60" y="396" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="96" y="386" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Публикации</text>
  <text x="96" y="408" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Редовно, в мрежите, в които са Вашите клиенти</text>

  <!-- step 6 -->
  <circle cx="60" cy="454" r="18" fill="#2a8178"/>
  <text x="60" y="460" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">6</text>
  <text x="96" y="450" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Статии и текстове</text>
  <text x="96" y="472" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">Отговори на честите въпроси на клиентите</text>

  <!-- step 7 -->
  <circle cx="60" cy="518" r="18" fill="#2a8178"/>
  <text x="60" y="524" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">7</text>
  <text x="96" y="514" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#172933">Имейли</text>
  <text x="96" y="536" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4f5d63">До Ваши клиенти или до хора, съгласни да получават новини</text>

  <!-- footer note -->
  <rect x="24" y="576" width="752" height="62" rx="12" fill="#d0ebfc"/>
  <text x="44" y="602" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#172933">Платената реклама има най-малко смисъл, когато води към сайт,</text>
  <text x="44" y="624" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#172933">на който посетителят не намира как да се свърже с Вас.</text>
</svg>
