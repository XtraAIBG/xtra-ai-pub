<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Седемте точки на заданието за копирайтъра: цел, читател, факти за продукта или услугата, тон, думи за търсене, място и обем, срок и одобрение</title>
  <desc id="d">Номериран списък на това, което да опишете в заданието (брифа), преди копирайтърът да започне да пише.</desc>
  <rect x="1" y="1" width="758" height="468" rx="16" fill="#ffffff" stroke="#dbe6e3" stroke-width="1.5"/>
  <text x="32" y="50" font-size="22" font-weight="700" fill="#172933">Какво да включите в заданието (брифа)</text>
  <text x="32" y="78" font-size="14" font-weight="400" fill="#4f5d63">Колкото по-ясно опишете задачата, толкова по-малко поправки след първия вариант</text>
  <rect x="32" y="100" width="340" height="72" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="136" r="16" fill="#2a8178"/>
  <text x="64" y="141" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="131" font-size="16" font-weight="700" fill="#172933">Цел</text>
  <text x="92" y="154" font-size="14" font-weight="400" fill="#4f5d63">какво да направи читателят</text>
  <rect x="388" y="100" width="340" height="72" rx="14" fill="#d0ebfc"/>
  <circle cx="420" cy="136" r="16" fill="#256f9e"/>
  <text x="420" y="141" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="448" y="131" font-size="16" font-weight="700" fill="#172933">Читател</text>
  <text x="448" y="154" font-size="14" font-weight="400" fill="#4f5d63">кои са клиентите и какво питат</text>
  <rect x="32" y="184" width="340" height="72" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="220" r="16" fill="#2a8178"/>
  <text x="64" y="225" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="215" font-size="16" font-weight="700" fill="#172933">Факти за продукта</text>
  <text x="92" y="238" font-size="14" font-weight="400" fill="#4f5d63">какво точно предлагате</text>
  <rect x="388" y="184" width="340" height="72" rx="14" fill="#d0ebfc"/>
  <circle cx="420" cy="220" r="16" fill="#256f9e"/>
  <text x="420" y="225" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="448" y="215" font-size="16" font-weight="700" fill="#172933">Тон</text>
  <text x="448" y="238" font-size="14" font-weight="400" fill="#4f5d63">официално или непринудено</text>
  <rect x="32" y="268" width="340" height="72" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="304" r="16" fill="#2a8178"/>
  <text x="64" y="309" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="92" y="299" font-size="16" font-weight="700" fill="#172933">Думи за търсене</text>
  <text x="92" y="322" font-size="14" font-weight="400" fill="#4f5d63">с които клиентите Ви търсят</text>
  <rect x="388" y="268" width="340" height="72" rx="14" fill="#d0ebfc"/>
  <circle cx="420" cy="304" r="16" fill="#256f9e"/>
  <text x="420" y="309" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="448" y="299" font-size="16" font-weight="700" fill="#172933">Място и обем</text>
  <text x="448" y="322" font-size="14" font-weight="400" fill="#4f5d63">къде се публикува, колко дълъг</text>
  <rect x="32" y="352" width="696" height="72" rx="14" fill="#d5f6eb"/>
  <circle cx="64" cy="388" r="16" fill="#2a8178"/>
  <text x="64" y="393" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="92" y="383" font-size="16" font-weight="700" fill="#172933">Срок и одобрение</text>
  <text x="92" y="406" font-size="14" font-weight="400" fill="#4f5d63">кога Ви трябва текстът и кой от Вашия екип ще го одобри</text>
</svg>
