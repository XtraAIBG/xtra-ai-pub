<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" width="800" height="468" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Трите основни вида лого: словно лого, символ и комбинирано лого, показани с абстрактни форми без реални марки</title>
  <desc id="d">Три карти: словно лого е само името с подбран шрифт, символът е самостоятелен знак без текст, а комбинираното лого съчетава символ и име; отдолу е отбелязано, че символът може да се използва сам на малки места.</desc>
  <rect x="1" y="1" width="798" height="466" rx="16" fill="#ffffff" stroke="#dbe5e7" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#172933">Основните видове лого</text>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#4f5d63">Изборът зависи от името и от местата, където знакът ще се показва</text>
  <rect x="24" y="104" width="240" height="264" rx="14" fill="#d5f6eb"/>
  <rect x="44" y="124" width="200" height="120" rx="12" fill="#ffffff" stroke="#c4e4da" stroke-width="1.2"/>
