  <text x="144" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#172933">Словно лого</text>
  <text x="144" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">Само името, изписано</text>
  <text x="144" y="332" text-anchor="middle" font-size="14" fill="#4f5d63">с подбран шрифт</text>
  <rect x="280" y="104" width="240" height="264" rx="14" fill="#d5f6eb"/>
  <rect x="300" y="124" width="200" height="120" rx="12" fill="#ffffff" stroke="#c4e4da" stroke-width="1.2"/>
  <circle cx="400" cy="184" r="34" fill="#c9eee4" stroke="#2a8178" stroke-width="2"/>
  <rect x="384.7" y="168.7" width="30.6" height="30.6" rx="4" fill="none" stroke="#1f6a66" stroke-width="2.5" transform="rotate(45 400 184)"/>
  <circle cx="400" cy="184" r="6.1" fill="#1f6a66"/>
  <text x="400" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#172933">Символ</text>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">Самостоятелен знак</text>
  <text x="400" y="332" text-anchor="middle" font-size="14" fill="#4f5d63">без текст</text>
  <rect x="536" y="104" width="240" height="264" rx="14" fill="#d5f6eb"/>
  <rect x="556" y="124" width="200" height="120" rx="12" fill="#ffffff" stroke="#c4e4da" stroke-width="1.2"/>
