  <text x="656" y="310" text-anchor="middle" font-size="14" fill="#4f5d63">Символ и име заедно</text>
  <rect x="24" y="384" width="752" height="60" rx="12" fill="#d0ebfc"/>
  <text x="400" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#172933">Символът може да се използва сам на малки места</text>
