<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" aria-labelledby="t d" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Файловете, които да поискате от дизайнера: векторен файл, PNG с прозрачен фон, версии на знака, цветови кодове, шрифтовете и правата</title>
  <desc id="d">Списък от шест отметнати карти с файловете и данните за логото, които е добре да получите от дизайнера, и бележка да пазите файловете на място с общ достъп.</desc>
  <rect x="1" y="1" width="798" height="474" rx="16" fill="#ffffff" stroke="#dbe5e7" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#172933">Какви файлове да поискате от дизайнера</text>
  <text x="400" y="80" text-anchor="middle" font-size="15" fill="#4f5d63">Поискайте пълен комплект файлове, когато логото е готово</text>
  <rect x="24" y="104" width="368" height="84" rx="14" fill="#d5f6eb"/>
  <circle cx="60" cy="146" r="18" fill="#ffffff" stroke="#2a8178" stroke-width="2"/>
