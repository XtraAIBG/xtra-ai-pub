  <path d="M52 338 L58 344 L69 331" fill="none" stroke="#2a8178" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="326" font-size="16" font-weight="700" fill="#172933">Шрифтовете</text>
  <text x="94" y="348" font-size="14" fill="#4f5d63">Имената и условията</text>
  <text x="94" y="367" font-size="14" fill="#4f5d63">за ползване</text>
  <rect x="408" y="296" width="368" height="84" rx="14" fill="#d0ebfc"/>
