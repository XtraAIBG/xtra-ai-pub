  <text x="478" y="326" font-size="16" font-weight="700" fill="#172933">Правата</text>
  <text x="478" y="348" font-size="14" fill="#4f5d63">Писмено уточнение какви</text>
  <text x="478" y="367" font-size="14" fill="#4f5d63">права получавате</text>
  <rect x="24" y="396" width="752" height="56" rx="12" fill="#f3f7f8" stroke="#dbe5e7" stroke-width="1"/>
