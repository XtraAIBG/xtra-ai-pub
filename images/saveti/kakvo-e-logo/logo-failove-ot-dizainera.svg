  <text x="94" y="252" font-size="14" fill="#4f5d63">Пълноцветна, черна</text>
  <text x="94" y="271" font-size="14" fill="#4f5d63">и бяла версия</text>
  <rect x="408" y="200" width="368" height="84" rx="14" fill="#d0ebfc"/>
  <circle cx="444" cy="242" r="18" fill="#ffffff" stroke="#256f9e" stroke-width="2"/>
  <path d="M436 242 L442 248 L453 235" fill="none" stroke="#256f9e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="230" font-size="16" font-weight="700" fill="#172933">Цветови кодове</text>
  <text x="478" y="252" font-size="14" fill="#4f5d63">HEX или RGB за екран,</text>
  <text x="478" y="271" font-size="14" fill="#4f5d63">CMYK за печат</text>
  <rect x="24" y="296" width="368" height="84" rx="14" fill="#d5f6eb"/>
