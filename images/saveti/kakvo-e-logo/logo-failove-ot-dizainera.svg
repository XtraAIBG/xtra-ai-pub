  <text x="94" y="156" font-size="14" fill="#4f5d63">SVG, PDF или EPS</text>
  <text x="94" y="175" font-size="14" fill="#4f5d63">за печат и за промени</text>
  <rect x="408" y="104" width="368" height="84" rx="14" fill="#d0ebfc"/>
  <circle cx="444" cy="146" r="18" fill="#ffffff" stroke="#256f9e" stroke-width="2"/>
