  <text x="478" y="134" font-size="16" font-weight="700" fill="#172933">PNG с прозрачен фон</text>
  <text x="478" y="156" font-size="14" fill="#4f5d63">Без бял правоъгълник</text>
  <text x="478" y="175" font-size="14" fill="#4f5d63">около знака</text>
  <rect x="24" y="200" width="368" height="84" rx="14" fill="#d5f6eb"/>
  <circle cx="60" cy="242" r="18" fill="#ffffff" stroke="#2a8178" stroke-width="2"/>
